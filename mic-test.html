<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイク診断</title><style>body{font:18px system-ui;max-width:720px;margin:40px auto;padding:16px}button{font:inherit;padding:14px}pre{white-space:pre-wrap;background:#eee;padding:16px}</style><h1>マイク接続診断</h1><button id="test">マイク接続テスト</button><pre id="out">JavaScriptがまだ実行されていない</pre><script>
(function(){var out=document.getElementById('out');function log(s){out.textContent+='\n'+s;}out.textContent='JavaScript: OK';log('URL: '+location.href);log('安全な接続: '+window.isSecureContext);log('マイクAPI: '+!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));log('音声認識API: '+!!(window.SpeechRecognition||window.webkitSpeechRecognition));document.getElementById('test').onclick=async function(){log('ボタン反応: OK');try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('マイクAPIなし');log('マイク許可を要求中…');var stream=await navigator.mediaDevices.getUserMedia({audio:true});log('マイク接続: OK');stream.getAudioTracks().forEach(function(t){log('マイク名: '+t.label);t.stop();});}catch(e){log('エラー: '+e.name+' / '+e.message);}};})();
</script></html>
